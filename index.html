<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E V O L V E – People's Choice Awards</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e8f0ff,#fdf6ff);
}

.card{
  max-width:900px;
  margin:auto;
  background:rgba(255,255,255,.97);
  border-radius:24px;
  padding:35px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}

h1{
  text-align:center;
  margin:10px 0;
  color:#1f2937;
}

h2{
  text-align:center;
  color:#6b7280;
  font-weight:normal;
  margin:0;
}

label{
  display:block;
  margin-top:22px;
  font-weight:bold;
  color:#111827;
}

.subtitle{
  display:block;
  font-size:13px;
  color:#6b7280;
  margin-top:4px;
  font-style:italic;
  font-weight:normal;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #d1d5db;
  font-size:15px;
}

input:focus,select:focus{
  outline:none;
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

.progress-wrap{
  margin:25px 0;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6366f1,#8b5cf6);
  transition:.3s;
}

button{
  width:100%;
  margin-top:35px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  background:gray;
  cursor:not-allowed;
  transform:none;
}

#msg{
  margin-top:20px;
  text-align:center;
  font-weight:bold;
}

@media(max-width:768px){
  .card{
    padding:20px;
  }
}
</style>
</head>
<body>

<div class="card">
  <h2>Rotaract Club of Pune Kalyani Nagar presents</h2>
  <h1>🏆 E V O L V E – People's Choice Awards 🏆</h1>

  <label>Your Email</label>
  <input
    type="text"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
  >

  <div class="progress-wrap">
    <div id="progressText">0/10 completed</div>
    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <div id="form"></div>

  <button id="submitBtn" onclick="submitVote()">
    Submit Vote
  </button>

  <div id="msg"></div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwxx0WRRMbx-8l98wX-3n-dGr1Iul4uRRHJ6HnrWiQTAE7xVDs_-UdREu6eZ-i1chcaTQ/exec";

const nominees = [
  "Salim Mulani",
  "Dhiraj Nikam",
  "Avanti Barhate",
  "Nida Baig",
  "Sahil Aghav",
  "ANUJ PAUL",
  "Vedant Buge",
  "Aniket Jagtap",
  "Mrunal Bharati",
  "Abhijit Barangule",
  "Siddharth Pattanshetti",
  "Rishikesh Kadre",
  "Siddhant Thopate",
  "Siddhesh Gaikwad",
  "Ammar Shaikh",
  "Akanksha Solse",
  "Bhakti Makhare",
  "Shrikant Dhangar",
  "Annie Varhale",
  "Onkar Dhame",
  "Khushi Oswal",
  "Shrikant Kedari",
  "Vaishnavi Thakur",
  "Jay Agarwal",
  "Nikhil Bhosale"
];

const awards = [
{
title:"💘 District Event = Rishta Dekho Yojana Award",
desc:"Attendance suspiciously high at district events 👀"
},
{
title:"🚿 Main Aa Raha Hoon Fiction Award",
desc:"written by someone still in towel"
},
{
title:"📱 WhatsApp Pe Don, Ground Pe Gone Award",
desc:"very active online, spiritually absent offline"
},
{
title:"🤯 Club Ka Jethalal Award",
desc:"creates chaos, somehow lovable"
},
{
title:"🤷‍♀️ Club Ki Alia Bhatt Award",
desc:"present everywhere, understanding nowhere"
},
{
title:"📈 Club Ka Mutual Fund Award",
desc:"invests in every friendship for future benefits"
},
{
title:"⏳ Club Ka Loading Screen Award",
desc:"takes time to warm up socially"
},
{
title:"🔋 Low Battery Human Award",
desc:"social battery dies within 20 minutes"
},
{
title:"🎭 Ye Sab Doglapan Hai Award",
desc:"says 'I won’t come', arrives first"
},
{
title:"🏠 Abba Nahi Manenge Award",
desc:"rejects every plan dramatically"
}
];

const form=document.getElementById("form");

awards.forEach((award,i)=>{
  let label=document.createElement("label");

  label.innerHTML=
  `${i+1}. ${award.title}
   <span class="subtitle">${award.desc}</span>`;

  let select=document.createElement("select");
  select.id="award"+i;
  select.onchange=updateDropdowns;

  form.appendChild(label);
  form.appendChild(select);
});

function updateDropdowns(){
  let selected=[];

  awards.forEach((_,i)=>{
    const val=document.getElementById("award"+i).value;
    if(val) selected.push(val);
  });

  awards.forEach((_,i)=>{
    const dd=document.getElementById("award"+i);
    const current=dd.value;

    dd.innerHTML =
      '<option value="">Select nominee</option>';

    nominees.forEach(name=>{
      if(!selected.includes(name) || name===current){
        let option=document.createElement("option");
        option.value=name;
        option.text=name;

        if(name===current){
          option.selected=true;
        }

        dd.appendChild(option);
      }
    });
  });

  let percent=(selected.length/awards.length)*100;

  document.getElementById("bar").style.width =
    percent+"%";

  document.getElementById("progressText").innerText =
    `${selected.length}/10 completed`;
}

function validEmail(email){
  email = email.trim().toLowerCase();

  return email.includes("@") &&
         email.includes(".") &&
         email.length >= 5;
}

function submitVote(){

  const btn=document.getElementById("submitBtn");
  const msg=document.getElementById("msg");

  const email =
    document.getElementById("email")
    .value
    .trim()
    .toLowerCase();

  if(!validEmail(email)){
    alert("Please enter valid email");
    return;
  }

  let votes=[];

  for(let i=0;i<awards.length;i++){
    let value=document.getElementById("award"+i).value;

    if(!value){
      alert("Please complete all selections");
      return;
    }

    votes.push(value);
  }

  btn.disabled=true;
  btn.innerText="Submitting...";
  msg.innerText="";

  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      email:email,
      votes:votes
    })
  })
  .then(response=>response.json())
  .then(data=>{
    msg.innerText=data.message;
    msg.style.color =
      data.success ? "green" : "red";

    if(data.success){
      btn.innerText="Vote Submitted ✓";
    }else{
      btn.disabled=false;
      btn.innerText="Submit Vote";
    }
  })
  .catch(()=>{
    msg.innerText="Submission failed";
    msg.style.color="red";
    btn.disabled=false;
    btn.innerText="Submit Vote";
  });
}

updateDropdowns();
</script>

</body>
</html>
